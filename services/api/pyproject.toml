[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-api"
version = "0.1.0"
description = "FastAPI gateway for the RAG lakehouse"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx[http2]>=0.27",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004", "PLC0415", "N812"]
