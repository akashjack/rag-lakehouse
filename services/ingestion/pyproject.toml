[project]
name = "ingestion"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "pymupdf>=1.24",
  "playwright>=1.47",
  "trafilatura>=1.12",
  "httpx[http2]>=0.27",
  "boto3>=1.35",
  "structlog>=24.4",
  "typer>=0.12",
  "tenacity>=9.0",
  "selectolax>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]
