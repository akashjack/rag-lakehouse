[project]
name = "lakehouse"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pyspark==3.5.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "structlog>=24.4",
  "typer>=0.12",
  "oracledb>=2.4",
  "httpx[http2]>=0.27",
  "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lakehouse"]
