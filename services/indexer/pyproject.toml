[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-indexer"
version = "0.1.0"
description = "Embedding + vector store layer for the RAG lakehouse"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx[http2]>=0.27",
    "oracledb>=2.4",
    "structlog>=24.1",
    "typer>=0.12",
    "tenacity>=8.2",
    "langchain>=0.3",
    "langchain-ollama>=0.3",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["indexer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004", "PLC0415", "N812"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
ignore_missing_imports = true
