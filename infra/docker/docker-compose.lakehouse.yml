services:
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: rag-iceberg-rest
    networks:
      - ragnet
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://lakehouse/warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"

  spark:
    image: apache/spark:3.5.3
    container_name: rag-spark
    networks:
      - ragnet
    user: root
    ports:
      - "4040:4040"
      - "7077:7077"
      - "8080:8080"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      SPARK_NO_DAEMONIZE: "1"
      SPARK_MASTER_HOST: spark
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
      SPARK_HOME: /opt/spark
      PATH: /opt/spark/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    volumes:
      - ../../services/lakehouse:/opt/lakehouse
      - ./volumes/spark-warehouse:/opt/spark/work
      - ./volumes/spark-jars:/opt/spark/jars-extra
    command:
      - bash
      - -c
      - |
        set -e
        mkdir -p /opt/spark/jars-extra
        cd /opt/spark/jars-extra
        for url in \
          https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-spark-runtime-3.5_2.12/1.6.1/iceberg-spark-runtime-3.5_2.12-1.6.1.jar \
          https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-aws-bundle/1.6.1/iceberg-aws-bundle-1.6.1.jar \
          https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar \
          https://repo1.maven.org/maven2/com/amazonaws/aws-java-sdk-bundle/1.12.262/aws-java-sdk-bundle-1.12.262.jar
        do
          fname=$$(basename "$$url")
          [ -f "$$fname" ] || curl -sLO "$$url"
        done
        cp /opt/spark/jars-extra/*.jar /opt/spark/jars/
        echo ">>> Starting Spark master"
        exec /opt/spark/sbin/start-master.sh

networks:
  ragnet:
    name: ragnet
    external: true
