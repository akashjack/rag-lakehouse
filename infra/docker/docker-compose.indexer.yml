# Phase 3: Oracle 23ai Free (vector + full-text) + Ollama (local embeddings).
# Both join the existing 'ragnet' network created by the MinIO compose.

services:
  oracle:
    image: container-registry.oracle.com/database/free:23.5.0.0
    container_name: rag-oracle
    networks:
      - ragnet
    ports:
      - "1521:1521"
    environment:
      ORACLE_PWD: ${ORACLE_PWD:-RagPass_2026}
      ORACLE_CHARACTERSET: AL32UTF8
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      # First boot takes 60-120s while Oracle initializes the datafiles.
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    shm_size: 1g
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.4.7
    container_name: rag-ollama
    networks:
      - ragnet
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  oracle-data:
  ollama-data:

networks:
  ragnet:
    external: true
